[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tanga-py"
dynamic = ["version"]
description = "Interactive technical visualization and geometric algebra (Clifford algebra) library — 3D/2D scenes with animation and standalone HTML export, plus algebras over vector spaces up to 31 dimensions with Euclidean, projective, and conformal support. C++ core with Python interface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "numpy>=2.5.1",
    "psutil>=7.2.2",
    "rich>=13.0",
]          # runtime deps are zero; pybind11 is build-only

[project.optional-dependencies]
compile = [
    "pybind11>=2.11",
    "cmake>=3.18",
    "ninja",
]
galgebra = ["galgebra>=0.5.0"]
examples = [
    "scipy>=1.13",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "ipython>=8.30",
]

[tool.ruff.lint]
# Keep reporting unused imports, but do not automatically delete them
unfixable = ["F401"]
# Type-hint coverage (paired with `ty` for correctness).  `ANN401` is off: the
# dynamically-typed surfaces (algebra bindings, viz registries, notebooks) are
# `Any` by nature.
extend-select = ["ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# The remaining `F401`/`E402`/`F841`/`E741` debt in `py/tests` is tracked
# separately.  Star imports are *not* ignored anywhere: the two analysis test
# files import their entity/operator classes explicitly, so `F403`/`F405` are
# enforced repo-wide.  ANN coverage is deliberately *not* blanket-ignored here
# either: the existing unannotated tests carry per-line `# noqa: ANN…`
# directives as a frozen baseline, so **new** tests must be annotated to pass
# the gate.
"py/tests/**" = ["F401", "E402", "E741", "F841"]

[tool.ty.rules]
# Approximate mypy/pyright --strict; paired with ruff ANN for coverage.
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.ty.src]
include = ["py/pytanga", "py/examples"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["py/pytanga"]

[tool.hatch.build.targets.wheel.force-include]
"cpp/Tan.GA" = "pytanga/_ga_src/Tan.GA"
"cpp/Tan.Math" = "pytanga/_ga_src/Tan.Math"
"cpp/Tan.Core" = "pytanga/_ga_src/Tan.Core"
"precompiled" = "pytanga/precompiled"
"docs/py" = "pytanga/_docs/py"
"docs/cpp" = "pytanga/_docs/cpp"
"docs/dev" = "pytanga/_docs/dev"
"docs/changelog" = "pytanga/_docs/changelog"
"docs/index.md" = "pytanga/_docs/index.md"
"py/examples" = "pytanga/_examples"

[dependency-groups]
dev = [
    "mike>=2.0",
    "mkdocs-material>=9.7.7",
    "mkdocs-jupyter>=0.25",
    "pre-commit>=4.3",
    "pytest>=9.1.1",
    "ruff==0.14.0",
    "tanga-py[compile,examples,galgebra]",
    "twine>=6.0",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
testpaths  = ["py/tests"]
pythonpath = ["py"]
