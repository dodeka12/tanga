site_name: TanGA Documentation
site_url: https://dodeka12.github.io/tanga/
repo_url: https://github.com/dodeka12/tanga
repo_name: dodeka12/tanga
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

extra:
  version:
    provider: mike

docs_dir: docs

nav:
  - Home: index.md

  - C++ Documentation:
    - Overview: cpp/index.md
    - Fixed-space multivectors: cpp/multivectors-e3-p3-n3.md
    - Subspace multivectors: cpp/subspace-multivectors.md
    - Dynamic multivectors: cpp/dynamic-multivectors.md
    - Matrix mapping & equations: cpp/matrix-mapping-and-equations.md
    - Product matrices: cpp/product-matrices.md
    - Congruence maps: cpp/congruence.md
    - Duals: cpp/duals.md

  - Python Documentation:
