name: Promote RC to Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    name: Promote latest RC to stable release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find and promote latest RC tag
        run: |
          RC_TAG=$(git tag -l 'v*-rc*' --sort=-v:refname | head -1)
          if [[ -z "$RC_TAG" ]]; then
            echo "No RC tags found. Nothing to promote."
            exit 0
          fi

          CLEAN_TAG=$(echo "$RC_TAG" | sed 's/-rc.*//')
          echo "Promoting $RC_TAG → $CLEAN_TAG"

          # Check if the clean tag already exists
          if git rev-parse "$CLEAN_TAG" >/dev/null 2>&1; then
            echo "Tag $CLEAN_TAG already exists. Skipping."
            exit 0
          fi

          git tag -a "$CLEAN_TAG" -m "Release $CLEAN_TAG"
          git push origin "$CLEAN_TAG"
          echo "Pushed $CLEAN_TAG — publish workflow will build and upload to PyPI."