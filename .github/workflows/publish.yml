  publish:
    name: Publish to PyPI
    needs: [build-pure]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - name: Determine target repository
        id: target
        run: |
          # When called via workflow_call, use `is_rc` input.
          # When triggered by tag push, check if tag contains '-rc'.
          if [[ "${{ inputs.is_rc }}" == "true" ]] || [[ "${{ github.ref_name }}" == *-rc* ]]; then
            echo "url=https://test.pypi.org/legacy/" >> $GITHUB_OUTPUT
          else
            echo "url=https://upload.pypi.org/legacy/" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Test PyPI
        if: steps.target.outputs.url == 'https://test.pypi.org/legacy/'
        uses: pypa/gh-action-pypi-publish@v1.12.3
        with:
          packages-dir: dist/
          repository-url: ${{ steps.target.outputs.url }}
          password: ${{ secrets.TESTPYPI_TOKEN }}
          verbose: true

      - name: Publish to PyPI
        if: steps.target.outputs.url == 'https://upload.pypi.org/legacy/'
        uses: pypa/gh-action-pypi-publish@v1.12.3
        with:
          packages-dir: dist/
          repository-url: ${{ steps.target.outputs.url }}
          password: ${{ secrets.PYPI_TOKEN }}
          verbose: true
