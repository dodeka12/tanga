name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      is_rc:
        type: boolean
        default: true
        description: 'Whether this is a release candidate (uses Test PyPI)'

permissions:
  contents: read

jobs:
  build-pure:
    name: Build pure wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Clean precompiled artifacts
        run: uv run python tools/clean-precompiled.py

      - name: Build wheel
        run: uv build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pure
          path: dist/*.whl

