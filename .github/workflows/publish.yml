name: Publish

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      is_rc:
        type: boolean
        default: true
        description: 'Whether this is a release candidate (uses Test PyPI)'
      version:
        type: string
        default: ''
        description: 'Forced version tag (e.g. v0.2.0). Strips v prefix for SETUPTOOLS_SCM_PRETEND_VERSION.'

permissions:
  contents: read

jobs:
  # -- Compute a valid PEP 440 version for the build ----------------------------
  #    setuptools-scm generates versions like 0.1.0.dev5+gabcdef from branches,
  #    but the +g{hash} local identifier is rejected by PyPI.  This job strips
  #    the local part so the version is always valid for wheel building.
  compute-version:
    name: Compute build version
    runs-on: ubuntu-24.04
    outputs:
      pretend_version: ${{ steps.compute.outputs.pretend_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: compute
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            # User-provided version (e.g. v0.2.0-rc1) — strip v prefix
            PRETEND="${VERSION#v}"
          else
            # Auto-derive from git: v0.1.0-5-ga1b2c3d → 0.1.0.dev5
            RAW=$(git describe --tags 2>/dev/null || echo "v0.0.0-0-g0000000")
            if echo "$RAW" | grep -q '\-'; then
              PRETEND=$(echo "$RAW" | sed -E 's/^v//; s/-([0-9]+)-g[0-9a-f]+$/.dev\1/')
            else
              PRETEND="${RAW#v}"
            fi
          fi
          echo "pretend_version=$PRETEND" >> $GITHUB_OUTPUT
          echo "Build version: $PRETEND"
        env:
          VERSION: ${{ inputs.version }}

  build-pure:
    name: Build pure wheel
    needs: [compute-version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Clean precompiled artifacts
        run: uv run python tools/clean-precompiled.py

      - name: Build wheel
        run: SETUPTOOLS_SCM_PRETEND_VERSION="$PRETEND_VERSION" uv build --wheel
        env:
          PRETEND_VERSION: ${{ needs.compute-version.outputs.pretend_version }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pure
          path: dist/*.whl

  # -- Linux precompiled build disabled temporarily for faster testing --
  build-linux:
    name: Build Linux wheel (${{ matrix.python-version }}, manylinux_x86_64)
    needs: [compute-version]
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - name: Setup environment
        run: |
          PY_ABI="cp${{ matrix.python-version }}"
          PY_ABI="${PY_ABI//.}"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "/opt/python/${PY_ABI}-${PY_ABI}/bin" >> $GITHUB_PATH
          echo "UV_PYTHON=/opt/python/${PY_ABI}-${PY_ABI}/bin/python${{ matrix.python-version }}" >> $GITHUB_ENV
  
      - name: Sync dependencies
        run: uv sync --group dev
  
      - name: Build precompiled
        run: uv run python tools/build-precompiled.py

      - name: Build wheel
        run: SETUPTOOLS_SCM_PRETEND_VERSION="$PRETEND_VERSION" uv build --wheel
        env:
          PRETEND_VERSION: ${{ needs.compute-version.outputs.pretend_version }}
  
      - name: Auditwheel repair
        run: |
          PY_ABI="cp${{ matrix.python-version }}"
          PY_ABI="${PY_ABI//.}"
          /opt/python/${PY_ABI}-${PY_ABI}/bin/pip install auditwheel
          /opt/python/${PY_ABI}-${PY_ABI}/bin/auditwheel repair dist/*.whl -w dist/
          rm dist/*-none-any.whl
          # auditwheel may produce py3-none-manylinux instead of cp312-cp312-manylinux
          # when extensions don't link libpython.  Force the correct ABI tag so that
          # cp312 and cp313 wheels have distinct filenames for artifact merging.
          for whl in dist/*.whl; do
            new_name="${whl/-py3-none-/-${PY_ABI}-${PY_ABI}-}"
            if [ "$whl" != "$new_name" ]; then
              mv "$whl" "$new_name"
              echo "Renamed: $(basename "$whl") -> $(basename "$new_name")"
            fi
          done
  
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python-version }}
          path: dist/*.whl

  # -- Windows build --
  build-windows:
    name: Build Windows wheel (${{ matrix.python-version }}, win_amd64)
    needs: [compute-version]
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Sync dependencies
        run: uv sync --group dev
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - name: Build precompiled
        run: uv run python tools/build-precompiled.py
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - name: Build wheel
        run: |
          $env:SETUPTOOLS_SCM_PRETEND_VERSION = "${{ needs.compute-version.outputs.pretend_version }}"
          uv build --wheel
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - name: Fix wheel platform tag
        run: uv run python tools/fix-wheel-tag.py
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist/*.whl

  # -- macOS build disabled until precompiled compilation is fixed --
  # build-macos:
  #   name: Build macOS wheel (${{ matrix.os }})
  #   strategy:
  #     matrix:
  #       os: [macos-13, macos-14]
  #   runs-on: ${{ matrix.os }}
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #
  #     - uses: astral-sh/setup-uv@v5
  #       with:
  #         enable-cache: true
  #
  #     - name: Sync dependencies
  #       run: uv sync --group dev
  #
  #     - name: Build precompiled
  #       run: uv run python tools/build-precompiled.py
  #
  #     - name: Build wheel and fix tag
  #       run: uv run bash tools/build-precompiled-wheel.sh
  #
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: wheels-macos-${{ matrix.os }}
  #         path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-pure, build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - name: Determine target repository
        id: target
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            # Non-main branch: always use Test PyPI
            echo "url=https://test.pypi.org/legacy/" >> $GITHUB_OUTPUT
            echo "::warning::Not on main branch (${{ github.ref_name }}). Forcing Test PyPI."
          elif [[ "${{ inputs.is_rc }}" == "true" ]]; then
            echo "url=https://test.pypi.org/legacy/" >> $GITHUB_OUTPUT
          else
            echo "url=https://upload.pypi.org/legacy/" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Test PyPI
        if: steps.target.outputs.url == 'https://test.pypi.org/legacy/'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ steps.target.outputs.url }}
          password: ${{ secrets.TESTPYPI_TOKEN }}
          verbose: true
          attestations: false
          skip-existing: true

      - name: Publish to PyPI
        if: steps.target.outputs.url == 'https://upload.pypi.org/legacy/'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ steps.target.outputs.url }}
          password: ${{ secrets.PYPI_TOKEN }}
          verbose: true
          attestations: false
