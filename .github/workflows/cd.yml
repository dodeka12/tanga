name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-bump:
    name: Version bump
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run version-tag.sh
        run: ./tools/version-tag.sh --rc --push

  docs-deploy:
    name: Build & deploy docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python toolchain
        run: uv sync --group dev

      - name: Get version
        run: |
          TANGA_VERSION=$(uv run python -c "from importlib.metadata import version; print(version('tanga-py'))")
          echo "TANGA_VERSION=$TANGA_VERSION" >> $GITHUB_ENV

      - name: Build MkDocs (strict)
        run: uv run mkdocs build --strict
        env:
          TANGA_VERSION: ${{ env.TANGA_VERSION }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: .