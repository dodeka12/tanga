{% extends "base.html" %}

{% block htmltitle %}
<title>
    {% if page.title and not page.is_homepage %}
    {{ page.title }} -
    {% endif %}
    {{ config.site_name }} (v{{ config.extra.version }})
</title>
{% endblock %}

{% block site_name %}
{{ config.site_name }} v{{ config.extra.version }}
{% endblock %}
