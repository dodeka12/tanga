<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanga SDF Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
        canvas { display: block; }
        #viewer-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        #tanga-status-area {
            position: fixed; top: 8px; right: 10px;
            display: flex; flex-direction: row-reverse; align-items: center; gap: 8px; z-index: 10;
        }
        #status { width: 10px; height: 10px; border-radius: 50%; background: #f44; pointer-events: none; transition: background 0.3s; }
        #status.connected { background: #4f4; }
        #status.disconnected { background: #f44; }
    </style>
</head>

<body>
    <div id="tanga-loading"
        style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,26,46,0.95);z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;color:#ccc;font-size:14px;transition:opacity 0.3s;">
        <div
            style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.2);border-top:3px solid #fff;border-radius:50%;animation:tanga-spin 0.8s linear infinite;margin-bottom:12px;">
        </div>Loading SDF Viewer
        <style>@keyframes tanga-spin { to { transform: rotate(360deg) } }</style>
    </div>
    <script>
        (function () {
            var _pollCount = 0;
            function _pollReady() {
                _pollCount++;
                if (window.__tanga_ready) {
                    var el = document.getElementById('tanga-loading');
                    if (el) { el.style.opacity = '0'; setTimeout(function () { if (el.parentNode) el.remove(); }, 300); }
                    return;
                }
                if (_pollCount < 200) setTimeout(_pollReady, 300);
            }
            setTimeout(_pollReady, 500);
        })();
    </script>
    <div id="tanga-status-area"><div id="status" class="disconnected"></div></div>
    <div id="viewer-container"></div>

    <script>
        var _cdn = new URLSearchParams(location.search).get('cdn');
        var _threeBase = _cdn === 'unpkg'
            ? 'https://unpkg.com/three@0.168.0'
            : 'https://cdn.jsdelivr.net/npm/three@0.168.0';
        window.__tanga_cdn = _cdn || 'jsdelivr';
        document.write(
            '<script type="importmap">' +
            '{"imports":{"three":"' + _threeBase + '/build/three.module.js",' +
            '"three/addons/":"' + _threeBase + '/examples/jsm/"}}' +
            '<'+'/script>'
        );
    </script>

    <script type="module" src="sdf/sdf_viewer.js"></script>
</body>

</html>
