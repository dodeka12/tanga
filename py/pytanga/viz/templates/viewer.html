<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanga 3D Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }

        canvas {
            display: block;
        }

        #viewer-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #tanga-status-area {
            position: fixed;
            top: 8px;
            right: 10px;
            display: flex;
            flex-direction: row-reverse;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        #status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44;
            pointer-events: none;
            transition: background 0.3s;
        }

        #status.connected {
            background: #4f4;
        }

        #status.disconnected {
            background: #f44;
        }
    </style>
</head>

<body>
    <div id="tanga-loading"
        style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,26,46,0.95);z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;color:#ccc;font-size:14px;transition:opacity 0.3s;">
        <div
            style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.2);border-top:3px solid #fff;border-radius:50%;animation:tanga-spin 0.8s linear infinite;margin-bottom:12px;">
        </div>Loading 3D Viewer<style>
            @keyframes tanga-spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </div>
    <script>
        (function () {
            var ESSENTIAL_FAILED = false;
            var RUNTIME_ERROR_MESSAGE = null;
            var OPTIONAL_SEEN = {};
            var OPTIONAL_MISSING = [];

            window.addEventListener('error', function (e) {
                var src = (e.target && e.target.src) || '';
                var msg = e.message || '';

                // Runtime exception — the scripts loaded, but a bug crashed
                // the page. Report it separately from a CDN/load failure.
                if (msg) {
                    if (!RUNTIME_ERROR_MESSAGE) RUNTIME_ERROR_MESSAGE = msg;
                    return;
                }

                // Resource / module load failure (no error message attached).
                if (!src) {
                    // Module resolution failure (importmap / Three.js import)
                    ESSENTIAL_FAILED = true;
                } else if (/marked/.test(src) && !OPTIONAL_SEEN.marked) {
                    OPTIONAL_SEEN.marked = true;
                    OPTIONAL_MISSING.push('marked (Markdown rendering)');
                } else if (/katex/.test(src) && !OPTIONAL_SEEN.katex) {
                    OPTIONAL_SEEN.katex = true;
                    OPTIONAL_MISSING.push('KaTeX (LaTeX math)');
                } else if (/html2canvas/.test(src) && !OPTIONAL_SEEN.html2canvas) {
                    OPTIONAL_SEEN.html2canvas = true;
                    OPTIONAL_MISSING.push('html2canvas (screenshot overlays)');
                } else if (/tabulator/.test(src) && !OPTIONAL_SEEN.tabulator) {
                    OPTIONAL_SEEN.tabulator = true;
                    OPTIONAL_MISSING.push('Tabulator (editable tables)');
                } else if (/three/.test(src)) {
                    ESSENTIAL_FAILED = true;
                }
            }, true);

            window.addEventListener('unhandledrejection', function (e) {
                if (!RUNTIME_ERROR_MESSAGE) {
                    var reason = e.reason;
                    RUNTIME_ERROR_MESSAGE = (reason && reason.message)
                        ? reason.message
                        : String(reason);
                }
            });

            var _pollCount = 0;
            var _slowNotice = null;
            var _resultsShown = false;
            function _pollReady() {
                _pollCount++;
                if (window.__tanga_ready) {
                    var loadingEl = document.getElementById('tanga-loading');
                    if (loadingEl) {
                        loadingEl.style.opacity = '0';
                        setTimeout(function () {
                            if (loadingEl.parentNode) loadingEl.remove();
                        }, 300);
                    }
                    if (_slowNotice) { _slowNotice.remove(); _slowNotice = null; }
                    return;
                }
                if (window.__tanga_cdn_failed) {
                    ESSENTIAL_FAILED = true;
                }
                if (ESSENTIAL_FAILED || RUNTIME_ERROR_MESSAGE) {
                    if (!_resultsShown) _showError();
                } else if (_pollCount >= 50 && !_slowNotice) {
                    _slowNotice = document.createElement('div');
                    _slowNotice.style.position = 'fixed';
                    _slowNotice.style.top = '0';
                    _slowNotice.style.left = '0';
                    _slowNotice.style.right = '0';
                    _slowNotice.style.zIndex = '99998';
                    _slowNotice.style.background = '#cc8800';
                    _slowNotice.style.color = '#fff';
                    _slowNotice.style.fontFamily = 'sans-serif';
                    _slowNotice.style.fontSize = '13px';
                    _slowNotice.style.padding = '8px 16px';
                    _slowNotice.style.textAlign = 'center';
                    _slowNotice.style.lineHeight = '1.5';
                    _slowNotice.innerHTML =
                        '<strong>Slow connection.</strong> ' +
                        'Libraries are still loading. This may take a while on a slow ' +
                        'network connection. The viewer will appear once loading completes.';
                    document.body.insertBefore(_slowNotice, document.body.firstChild);
                }
                if (!ESSENTIAL_FAILED && !RUNTIME_ERROR_MESSAGE) {
                    setTimeout(_pollReady, 300);
                }
            }
            setTimeout(_pollReady, 500);

            function _showError() {
                _resultsShown = true;
                var loadingEl = document.getElementById('tanga-loading');
                if (loadingEl) {
                    loadingEl.style.opacity = '0';
                    setTimeout(function () {
                        if (loadingEl.parentNode) loadingEl.remove();
                    }, 300);
                }
                if (_slowNotice) { _slowNotice.remove(); _slowNotice = null; }

                if (RUNTIME_ERROR_MESSAGE && !ESSENTIAL_FAILED) {
                    var rtBanner = document.createElement('div');
                    rtBanner.style.position = 'fixed';
                    rtBanner.style.top = '0';
                    rtBanner.style.left = '0';
                    rtBanner.style.right = '0';
                    rtBanner.style.zIndex = '99999';
                    rtBanner.style.background = '#cc2222';
                    rtBanner.style.color = '#fff';
                    rtBanner.style.fontFamily = 'sans-serif';
                    rtBanner.style.fontSize = '14px';
                    rtBanner.style.padding = '12px 20px';
                    rtBanner.style.textAlign = 'center';
                    rtBanner.style.lineHeight = '1.5';
                    rtBanner.innerHTML = '<strong>Viewer error.</strong> ';
                    rtBanner.appendChild(document.createTextNode(
                        'The 3D viewer could not start due to an unexpected error.'
                    ));
                    if (RUNTIME_ERROR_MESSAGE) {
                        var rtDetail = document.createElement('div');
                        rtDetail.style.fontSize = '12px';
                        rtDetail.style.marginTop = '4px';
                        rtDetail.style.opacity = '0.85';
                        rtDetail.style.fontFamily = 'monospace';
                        rtDetail.style.textAlign = 'left';
                        rtDetail.style.display = 'inline-block';
                        rtDetail.style.maxWidth = '100%';
                        rtDetail.style.overflow = 'auto';
                        rtDetail.textContent = RUNTIME_ERROR_MESSAGE;
                        rtBanner.appendChild(rtDetail);
                    }
                    document.body.insertBefore(rtBanner, document.body.firstChild);
                }

                if (ESSENTIAL_FAILED) {
                    // Auto-fallback: if we just failed on jsdelivr, silently
                    // retry with unpkg.  Only report failure if both CDNs fail.
                    if (window.__tanga_cdn !== 'unpkg') {
                        var params = new URLSearchParams(location.search);
                        params.set('cdn', 'unpkg');
                        location.search = params.toString();
                        return;  // never show banner on first failure
                    }

                    // Both CDNs failed — show countdown banner, then report to server
                    var COUNTDOWN_SECS = 10;
                    var _reported = false;

                    function _sendError() {
                        if (_reported) return; _reported = true;
                        try {
                            var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                            var ws = new WebSocket(protocol + '//' + location.host + '/ws');
                            ws.onopen = function () {
                                var pageToken = window.__tanga_page_token
                                    || new URLSearchParams(window.location.search).get('token');
                                ws.send(JSON.stringify({
                                    type: 'ready',
                                    scene: '',
                                    error: 'cdn_failure',
                                    error_msg: 'Failed to load Three.js from both jsdelivr '
                                        + 'and unpkg CDNs. Check internet, firewall, or proxy.',
                                    page_token: pageToken || undefined
                                }));
                                ws.close();
                            };
                        } catch (_) {}
                    }

                    var banner = document.createElement('div');
                    banner.style.position = 'fixed';
                    banner.style.top = '0';
                    banner.style.left = '0';
                    banner.style.right = '0';
                    banner.style.zIndex = '99999';
                    banner.style.background = '#cc2222';
                    banner.style.color = '#fff';
                    banner.style.fontFamily = 'sans-serif';
                    banner.style.fontSize = '14px';
                    banner.style.padding = '12px 20px';
                    banner.style.textAlign = 'center';
                    banner.style.lineHeight = '1.5';

                    var _countdownEl = document.createElement('span');
                    _countdownEl.style.fontWeight = 'bold';

                    function _updateBanner() {
                        banner.innerHTML = '';
                        var txt = document.createTextNode(
                            'Failed to load Three.js from both jsdelivr.net and unpkg.com. '
                            + 'Check internet, firewall, or proxy settings. '
                        );
                        banner.appendChild(txt);
                        if (COUNTDOWN_SECS > 0) {
                            banner.appendChild(document.createTextNode(
                                'Reporting in '
                            ));
                            _countdownEl.textContent = COUNTDOWN_SECS + 's';
                            banner.appendChild(_countdownEl);
                            banner.appendChild(document.createTextNode('…'));

                            var retry = document.createElement('button');
                            retry.textContent = 'Retry now';
                            retry.style.marginLeft = '12px';
                            retry.style.padding = '4px 12px';
                            retry.style.background = '#fff';
                            retry.style.color = '#cc2222';
                            retry.style.border = 'none';
                            retry.style.borderRadius = '3px';
                            retry.style.cursor = 'pointer';
                            retry.style.fontWeight = 'bold';
                            retry.onclick = function () { location.reload(); };
                            banner.appendChild(retry);
                        }
                    }

                    _updateBanner();
                    document.body.insertBefore(banner, document.body.firstChild);

                    // Countdown
                    var _timer = setInterval(function () {
                        COUNTDOWN_SECS--;
                        if (COUNTDOWN_SECS <= 0) {
                            clearInterval(_timer);
                            _countdownEl.textContent = '';
                            _sendError();
                            _updateBanner();
                        } else {
                            _countdownEl.textContent = COUNTDOWN_SECS + 's';
                        }
                    }, 1000);

                    // Also retry button that immediately reports + allows manual retry
                    // (handled by _sendError which is idempotent)
                }
                if (OPTIONAL_MISSING.length > 0) {
                    var warning = document.createElement('div');
                    warning.style.position = 'fixed';
                    warning.style.top = ESSENTIAL_FAILED ? '52px' : '0';
                    warning.style.left = '0';
                    warning.style.right = '0';
                    warning.style.zIndex = '99998';
                    warning.style.background = '#cc8800';
                    warning.style.color = '#fff';
                    warning.style.fontFamily = 'sans-serif';
                    warning.style.fontSize = '13px';
                    warning.style.padding = '8px 16px';
                    warning.style.textAlign = 'center';
                    warning.style.transition = 'opacity 1s';
                    warning.innerHTML =
                        '<strong>Optional libraries unavailable:</strong> ' +
                        OPTIONAL_MISSING.join(', ') +
                        '. Some features will be degraded.';
                    document.body.insertBefore(warning, document.body.firstChild);
                    setTimeout(function () {
                        warning.style.opacity = '0';
                        setTimeout(function () { if (warning.parentNode) warning.remove(); }, 1000);
                    }, 8000);
                }
            }
        })();
    </script>
    <div id="tanga-status-area">
        <div id="status" class="disconnected"></div>
    </div>
    <div id="viewer-container"></div>

        <script>
        // Choose CDN based on ?cdn= query param (fallback support)
        var _cdn = new URLSearchParams(location.search).get('cdn');
        var _threeBase = _cdn === 'unpkg'
            ? 'https://unpkg.com/three@0.168.0'
            : 'https://cdn.jsdelivr.net/npm/three@0.168.0';
        window.__tanga_cdn = _cdn || 'jsdelivr';
        document.write(
            '<script type="importmap">' +
            '{"imports":{"three":"' + _threeBase + '/build/three.module.js",' +
            '"three/addons/":"' + _threeBase + '/examples/jsm/"}}' +
            '<'+'/script>'
        );

        // ── CDN reachability probe ──────────────────────────
        // A failed module import (offline / blocked CDN) does not surface a
        // reliable `src` on the `error` event, so probe the CDN directly and
        // flag a definitive network failure for the error banner / fallback.
        (function () {
            var _probeUrl = _threeBase + '/build/three.module.js';
            var _controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
            var _timer = setTimeout(function () {
                if (_controller) _controller.abort();
            }, 6000);
            try {
                fetch(_probeUrl, {
                    method: 'GET',
                    mode: 'no-cors',
                    cache: 'no-store',
                    signal: _controller ? _controller.signal : undefined
                }).then(function () {
                    clearTimeout(_timer);
                }).catch(function (err) {
                    clearTimeout(_timer);
                    // Ignore the timeout (handled by the "slow connection"
                    // notice); only flag a definitive network failure.
                    if (!err || err.name !== 'AbortError') {
                        window.__tanga_cdn_failed = true;
                    }
                });
            } catch (_) {
                clearTimeout(_timer);
                window.__tanga_cdn_failed = true;
            }
        })();
    </script>

    <script>
        (function() {
            var isUnpkg = window.__tanga_cdn === 'unpkg';
            var cdn = isUnpkg ? 'https://unpkg.com' : 'https://cdn.jsdelivr.net/npm';
            // unpkg uses {pkg}@{ver}/{file}, jsdelivr uses {pkg}/{file}
            function url(pkg, file) {
                return isUnpkg ? (cdn + '/' + pkg + '/' + file) : (cdn + '/' + pkg.split('@')[0] + '/' + file);
            }
            document.write('<script src="' + url('marked@12.0.2', 'marked.min.js') + '"><' + '/script>');
            document.write('<link rel="stylesheet" href="' + url('katex@0.16.11', 'dist/katex.min.css') + '">');
            document.write('<script src="' + url('katex@0.16.11', 'dist/katex.min.js') + '"><' + '/script>');
            document.write('<script src="' + url('katex@0.16.11', 'dist/contrib/auto-render.min.js') + '"><' + '/script>');
            document.write('<script src="' + url('html2canvas@1.4.1', 'dist/html2canvas.min.js') + '"><' + '/script>');
            document.write('<link rel="stylesheet" href="' + url('tabulator-tables@6.5.2', 'dist/css/tabulator_midnight.min.css') + '">');
            document.write('<script src="' + url('tabulator-tables@6.5.2', 'dist/js/tabulator.min.js') + '"><' + '/script>');
        })();
    </script>

    <script type="module" src="viewer.js"></script>
    <script type="module" src="controls-panel.js"></script>
    <script type="module" src="banner.js"></script>
    <script type="module" src="dialog.js"></script>
    <script type="module" src="editor.js"></script>
    <script type="module" src="controls-attached.js"></script>
</body>

</html>
