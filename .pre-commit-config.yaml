repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: viewer-bundle-drift
        name: viewer bundle drift check
        entry: uv run python tools/build-viewer-js.py --check
        language: system
        pass_filenames: false
        files: ^(py/pytanga/viz/templates/.*\.(js|glsl)|py/pytanga/viz/export/_bootstrap/.*\.py)$